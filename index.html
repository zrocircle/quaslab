<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QUAS Lab - Quality, Understanding, Assurance & Software Lab at Hongik University. AI-Native SDLC, AI-Embedded V&V, Reinforcement Learning for SE." />
    <title>QUAS Lab | Hongik University</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
